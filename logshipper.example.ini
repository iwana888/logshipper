; logshipper configuration — COPY this to logshipper.ini and edit for your site.
; One logshipper process per host. Change [agent].instance on each host; when
; several app instances share the host, use [files].instances (see below) to
; give each log directory its own instance label instead of starting N processes.

[loki]
; Full push endpoint, http:// or https://.
; https:// needs the OpenSSL runtime DLLs next to logshipper.exe on Windows:
;   libssl-3.dll + libcrypto-3.dll            (MSVC build, e.g. Python's DLLs)
;   libssl-3-x64.dll + libcrypto-3-x64.dll   (mingw build, e.g. Git for Windows)
;   libssl-1_1-x64.dll + libcrypto-1_1-x64.dll (OpenSSL 1.1)
; Keep the ORIGINAL names; renaming breaks the DLL's own import table.
; On Linux, libssl.so.3 / libcrypto.so.3 (or 1.1) must be installed.
; Plain http needs none of this and never loads OpenSSL.
url=http://localhost:3100/loki/api/v1/push
; Optional bearer token (Loki multi-tenant / reverse-proxy auth).
token=
; Compress the request body with gzip.
gzip=true
; Request timeout in milliseconds.
timeout_ms=5000

[agent]
; Fixed labels (low cardinality). [agent].instance is the default for ALL paths;
; [files].instances (optional) overrides it per path entry.
job=myapp
instance=app-1
; Reader poll interval (ms).
poll_interval_ms=200
; Number of concurrent push workers (each has its own HTTP client).
; Raise if a single Loki connection can't keep up with log volume.
sender_threads=2
; Batch flush triggers (first to fire wins):
; Measured on this log: avg 153 B/line, p99 733 B, max 1125 B.
; 500 lines ~= 76 KiB of raw text, so the 128 KiB byte cap only fires on
; unusually long lines. Fewer, larger requests than the previous 100 lines.
batch_max_lines=500
batch_max_bytes=131072
batch_max_delay_ms=2000
; In-memory line cap; at the cap we stop reading (backpressure), never drop.
; 10000 lines is only ~1.5 MiB of raw text here.
buffer_max_lines=10000
; Optional: write this program's own status log to a file, in addition to the
; console (the console always stays full). Keep it OUTSIDE the tailed globs.
; By default the file gets ONLY error lines; use log_file_level=info to also
; keep INFO/WARN (incl. the 'pushed N lines' heartbeat) for liveness checks.
; log_file=/var/log/logshipper/logshipper.log
; log_file_level=error
; log_file_max_bytes=10485760
; log_file_max_files=5

[files]
; Semicolon-separated glob patterns; supports wildcards.
; Match ONLY the live, UNCOMPRESSED log (e.g. *.log). Do NOT match rotated
; compressed files like *.gz — this tool does NOT decompress logs.
; Multiple directories are handled by the SAME reader thread, with a fair
; per-file read quota and one independent {path,inode,offset} per file. E.g.:
;   paths=C:\logs\01\*.log;C:\logs\02\*.log;C:\logs\03\*.log
;   instances=app-01;app-02;app-03
;   'instances' (optional) is semicolon-separated and must have exactly one entry
;   per path entry, in the same order. Omit it to use [agent].instance everywhere.
;   Keep instance names low-cardinality: never use request/hotel/trace ids.
paths=/var/log/myapp/*.log
; Position store (atomic write). Make sure the directory is writable.
positions_file=/var/lib/logshipper/positions.json
; Max raw line length (bytes). Longer lines are truncated + '...[truncated]'.
; Longest observed line is 1125 B; 16 KiB keeps ~14x headroom while still
; bounding memory if the writer ever emits a pathological line.
max_line_bytes=16384

[timestamp]
; Semicolon-separated formats tried in order at the start of each line.
; Supported: strptime-style '%Y-%m-%d %H:%M:%S' / '%Y%m%d %H%M%S',
; 'unix_s' (leading Unix seconds), 'unix_ms' (leading Unix milliseconds).
; The tz option controls how a parsed wall-clock time is read:
;   tz=local  (default) treat it as LOCAL time on this host, convert to UTC
;   tz=utc            treat it as already UTC (no conversion)
; Without the first format EVERY line falls back to read-time, so Loki shows
; the push time instead of the real event time.
; The level_regex extracts a level label; first capture group is used, else
; whole match. Empty => no level label is added. Keep it low-cardinality
; because level becomes a Loki stream label.
formats=%Y-%m-%d %H:%M:%S;%Y%m%d %H%M%S;unix_ms
tz=local
level_regex=\[(INFO|WARN|ERROR|DEBUG|TRACE|EXC|ROTAT)

[http]
; Optional built-in web viewer + Loki reverse proxy (same-origin, no extra service).
; Bound to localhost by default; set e.g. 0.0.0.0:8099 to expose on the network.
; Leave [http].listen empty to disable the built-in server.
listen=127.0.0.1:8099
